  <style>:root {
  color-scheme: light;
  --canvas: var(--color-background-primary, #faf9f7);
  --surface: var(--color-background-secondary, #fff);
  --subtle: var(--color-background-tertiary, #f0efec);
  --text: var(--color-text-primary, #222221);
  --muted: var(--color-text-secondary, #63615d);
  --line: var(--color-border-primary, #e4e1dc);
  --accent: #3e725e;
  --accent-wash: #e8f0ea;
  --warning: #97602e;
  --action: #292a27;
  --action-text: #fff;
  font: 14px/1.5 var(--font-sans, system-ui), "Microsoft YaHei UI", sans-serif;
}

[data-theme="dark"] {
  color-scheme: dark;
  --canvas: var(--color-background-primary, #212120);
  --surface: var(--color-background-secondary, #272726);
  --subtle: var(--color-background-tertiary, #31312e);
  --text: var(--color-text-primary, #f1f0ec);
  --muted: var(--color-text-secondary, #b3b0a8);
  --line: var(--color-border-primary, #41413d);
  --accent: #9cc4ae;
  --accent-wash: #2a3b32;
  --warning: #e0ae7e;
  --action: #eeeee9;
  --action-text: #242522;
}

* { box-sizing: border-box; }
[hidden], .symbols { display: none !important; }
body { margin: 0; background: var(--canvas); color: var(--text); }
main { max-width: 580px; margin-inline: auto; padding: 20px clamp(12px, 4vw, 24px) 24px; }
h1, h2, p { margin: 0; }
h1 { font-size: 16px; font-weight: 680; line-height: 1.4; overflow-wrap: anywhere; }
h2 { font-size: 13px; font-weight: 680; }
small, .caption, .hint, .notice { color: var(--muted); font-size: 12px; }
small { display: block; }
.icon { width: 16px; height: 16px; flex: 0 0 16px; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
.heading, .row { display: flex; align-items: center; gap: 9px; }
.split { justify-content: space-between; }
.heading { margin-bottom: 14px; }
.thread-icon { width: 34px; height: 34px; display: grid; place-items: center; flex: 0 0 34px; background: var(--accent-wash); color: var(--accent); border-radius: 10px; }
.identity { min-width: 0; }
.caption { line-height: 1.3; margin-bottom: 2px; }
.notice { margin: 10px 0; overflow-wrap: anywhere; }
.notice.error { color: var(--warning); border-inline-start: 2px solid var(--warning); padding-inline-start: 8px; }

.next {
  display: grid;
  grid-template-columns: 16px minmax(0, 1fr) auto;
  align-items: center;
  gap: 2px 8px;
  margin-bottom: 14px;
  padding: 9px 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
}
.next .icon { color: var(--accent); }
.next h2 { color: var(--muted); }
#next-time { grid-column: 2; font-size: 14px; font-weight: 650; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
#next-action { grid-column: 3; grid-row: 1 / span 2; }

.section { padding-block: 12px; border-top: 1px solid var(--line); }
.quota-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 6px; }
.quota-tile { padding: 9px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }
.quota-tile strong, .quota-tile span { font-size: 12px; }
.quota-tile span { color: var(--muted); }
.quota-tile small { margin-top: 3px; font-variant-numeric: tabular-nums; }
.quota-tile[data-exhausted] span { color: var(--warning); }
progress { appearance: none; display: block; width: 100%; height: 4px; margin: 5px 0; border: 0; border-radius: 99px; background: var(--subtle); color: var(--accent); }
progress::-webkit-progress-bar { border-radius: inherit; background: var(--subtle); }
progress::-webkit-progress-value { border-radius: inherit; background: currentColor; }
.quota-tile[data-exhausted] progress { color: var(--warning); }
.hint { margin-top: 7px; overflow-wrap: anywhere; }

.settings, fieldset { display: grid; gap: 8px; }
fieldset { margin: 0; border: 0; padding: 0; min-width: 0; }
legend { padding: 0; margin-bottom: 5px; color: var(--muted); font-size: 12px; }
legend small { display: inline; margin-inline-start: 4px; }
.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; padding: 3px; background: var(--subtle); border: 1px solid var(--line); border-radius: 9px; }
.modes label { position: relative; min-width: 0; }
.modes input { position: absolute; opacity: 0; pointer-events: none; }
.modes span { display: grid; min-height: 30px; height: 100%; place-items: center; border: 1px solid transparent; border-radius: 7px; padding: 3px 4px; text-align: center; font-size: 12px; cursor: pointer; }
.modes input:checked + span { background: var(--surface); border-color: var(--line); font-weight: 650; }
.modes input:disabled + span { opacity: .55; cursor: default; }
#suggested-time { display: flex; align-items: center; gap: 7px; min-width: 0; padding: 6px 8px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; font-size: 12px; font-variant-numeric: tabular-nums; }
.continuous { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; }
.continuous > span { font-size: 13px; font-weight: 650; }
.continuous small { margin-top: 1px; font-weight: 400; }
.continuous input {
  appearance: none;
  display: inline-grid;
  align-items: center;
  width: 33px;
  height: 19px;
  flex: 0 0 33px;
  margin: 0;
  padding: 2px;
  border: 1px solid var(--line);
  border-radius: 99px;
  color: var(--muted);
  background: var(--subtle);
  cursor: pointer;
}
.continuous input::before { content: ""; width: 13px; height: 13px; border-radius: 50%; background: currentColor; }
.continuous input:checked { justify-items: end; background: var(--accent); color: var(--canvas); border-color: var(--accent); }

textarea, input:not([type="checkbox"], [type="radio"]) { font: inherit; min-width: 0; width: 100%; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; }
textarea { resize: vertical; }
#binding .row { margin-top: 5px; }
button { display: inline-flex; justify-content: center; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); font: inherit; font-size: 12px; font-weight: 650; min-height: 30px; padding: 5px 9px; white-space: nowrap; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
button:not(:disabled):hover { background: var(--subtle); }
:focus-visible, .modes input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.primary { background: var(--action); color: var(--action-text); border-color: var(--action); min-height: 34px; padding-inline: 13px; }
.primary:not(:disabled):hover { background: var(--action); opacity: .86; }
.quiet { border-color: transparent; background: transparent; color: var(--muted); }
.quiet .icon { width: 13px; height: 13px; flex-basis: 13px; }

summary { display: flex; align-items: center; gap: 7px; padding-block: 6px; list-style: none; cursor: pointer; font-size: 12px; font-weight: 640; }
summary::-webkit-details-marker { display: none; }
summary::after { content: ""; flex: 0 0 5px; width: 5px; height: 5px; margin-inline: auto 3px; border: solid var(--muted); border-width: 0 1.5px 1.5px 0; transform: rotate(-45deg); }
details[open] > summary::after { transform: rotate(45deg); }
details summary .icon { color: var(--muted); }
.options { border-top: 1px solid var(--line); }
.extras { display: grid; gap: 5px; padding-block: 3px 6px; }
.extras label, #binding label { font-size: 12px; }
.wake { display: flex; align-items: center; gap: 5px; }
.wake input { margin-inline: 0; accent-color: var(--accent); }
.history { border-top: 1px solid var(--line); padding-block: 5px; }
ul { list-style: none; margin: 0; padding: 0; color: var(--muted); font-size: 12px; }
li { border-top: 1px solid var(--line); padding-block: 7px; }
li .row { flex-wrap: wrap; }
pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; color: var(--text); }

dialog { width: min(360px, calc(100% - 24px)); color: var(--text); background: var(--surface); border: 1px solid var(--line); padding: 16px; border-radius: 12px; }
dialog::backdrop { background: #13141180; }
#confirm-detail { white-space: pre-wrap; overflow-wrap: anywhere; margin: 10px 0; max-height: 45vh; overflow: auto; }
dialog .row { justify-content: flex-end; }

@media (max-width: 350px) {
  .quota-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M20 13a4 4 0 0 1-4 4H9l-5 4v-5a4 4 0 0 1-1-3V8a4 4 0 0 1 4-4h9a4 4 0 0 1 4 4z"/><path d="M7 9h9M7 12h6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 5v5h-5M4 19v-5h5"/><path d="M4.7 9a8 8 0 0 1 13.6-3L20 9M4 15l1.7 3A8 8 0 0 0 19.3 15"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="15" rx="3"/><path d="M8 3v6m8-6v6M4 11h16"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M3 7h4m5 0h9M3 17h10m5 0h3"/><circle cx="9.5" cy="7" r="2.5"/><circle cx="15.5" cy="17" r="2.5"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3.5 5v5h5M4 9a8.5 8.5 0 1 1-.1 6M12 7.5V12l3 2"/></symbol>
  </svg>
  <main>
    <header class="heading">
      <span class="thread-icon"><svg class="icon" aria-hidden="true"><use href="#i-chat"/></svg></span>
      <div class="identity"><p class="caption">当前对话</p><h1 id="title">Codex Auto Resume</h1></div>
    </header>
    <p id="notice" class="notice" role="status">正在连接 Codex…</p>
    <form id="binding" hidden>
      <label for="link">本机会话链接</label>
      <div class="row"><input id="link" placeholder="codex://threads/…" autocomplete="off" required><button type="submit">核对会话</button></div>
    </form>
    <div id="workspace" hidden>
      <section class="next" aria-labelledby="next-label">
        <svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg><h2 id="next-label">下次发送</h2>
        <p id="next-time">暂无计划</p><button id="next-action" type="button" hidden>停止续跑</button>
      </section>
      <section class="section quota" aria-labelledby="quota-label">
        <header class="row split"><h2 id="quota-label">Codex 额度</h2><button id="refresh" type="button" class="quiet"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg>刷新</button></header>
        <div class="quota-grid">
          <div class="quota-tile"><div class="row split"><strong>5 小时</strong><span id="short-text">读取中</span></div><progress id="short-bar" max="100" value="0" aria-label="5 小时额度使用率"></progress><small id="short-reset"></small></div>
          <div class="quota-tile"><div class="row split"><strong>每周</strong><span id="week-text">读取中</span></div><progress id="week-bar" max="100" value="0" aria-label="周额度使用率"></progress><small id="week-reset"></small></div>
        </div>
        <p id="quota-reason" class="hint" hidden></p>
      </section>
      <form id="create" class="section settings">
        <h2>安排续跑</h2>
        <fieldset><legend>发送时间 <small>Windows 本地时间</small></legend>
          <div class="modes">
            <label><input type="radio" name="mode" value="quota" id="auto" checked disabled><span>额度恢复后 1 分钟</span></label>
            <label><input type="radio" name="mode" value="manual" id="manual"><span>手动指定时间</span></label>

        </details>
