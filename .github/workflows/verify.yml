name: Windows verification

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.10'
      - name: Run scheduler and panel tests
        run: python -X utf8 -m unittest discover -s tests -v
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - name: Install, type-check, and build panel
        working-directory: panel
        run: npm ci && npm run typecheck && npm run build
      - name: Verify bundled HTML is current
        run: git diff --exit-code -- plugins/codex-auto-resume/panel.html
      - name: Install packaging tools
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          python -m pip install uv==0.13.7
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          $compiler = Join-Path $env:RUNNER_TEMP 'inno-compiler'
          $official = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe'
          curl.exe --fail --location --silent --show-error --retry 3 $official --output $download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash -LiteralPath $download).Hash -ne 'a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c') {
              throw 'Inno Setup download checksum mismatch.'
          }
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="' + $compiler + '"'))
          $process = Start-Process -FilePath $download -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          $iscc = Join-Path $compiler 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) { throw 'Inno Setup compiler was not installed.' }
          "INNO_COMPILER=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build and test the Windows x64 installer
        if: github.event_name != 'pull_request'
        run: .\installer\Build.ps1 -InnoCompiler $env:INNO_COMPILER
      - name: Upload the Windows installer
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-installer
          path: dist/windows/Codex-Auto-Resume-*-Setup-x64.exe*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64-installer
          path: dist
      - name: Publish the installer to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        working-directory: dist
        run: |
          installer="Codex-Auto-Resume-${RELEASE_TAG#v}-Setup-x64.exe"
          checksum="$installer.sha256"
          sha256sum --check --strict "$checksum"
          if existing=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name'); then
            if grep -Fxq "$installer" <<< "$existing" && grep -Fxq "$checksum" <<< "$existing"; then
              echo 'The release already has both assets.'
            elif grep -Fxq "$installer" <<< "$existing" || grep -Fxq "$checksum" <<< "$existing"; then
              echo 'The release has only one of the two assets. Verify it before retrying.' >&2
              exit 1
            else
              gh release upload "$RELEASE_TAG" "$installer" "$checksum"
            fi
          else
            cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          Download the Windows x64 setup file and run it after signing in to Codex Desktop. The installer includes the Python runtime and dependencies. Reopen Codex and use Show tabs (Ctrl+Shift+B) to open Codex Auto Resume.

          下载 Windows x64 安装包，双击安装后正常重开 Codex。在本机会话里点击「显示标签页」（Ctrl+Shift+B），从新标签页的 Open 菜单打开 Codex Auto Resume。

          [中文教程](https://github.com/PanGucheng/Codex-Auto-Resume#readme) · [English guide](https://github.com/PanGucheng/Codex-Auto-Resume/blob/main/docs/README.en.md)
          EOF
            gh release create "$RELEASE_TAG" "$installer" "$checksum" --verify-tag --title "Codex Auto Resume ${RELEASE_TAG#v}" --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes
          fi
